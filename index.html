<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JUSTTALK 1.1 ALPHA</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #212121; color: #ececec; display: flex; height: 100vh; overflow: hidden; }

        #sidebar { width: 260px; background-color: #171717; border-right: 1px solid #2f2f2f; display: flex; flex-direction: column; padding: 12px; }
        .new-chat-btn { border: 1px solid #424242; border-radius: 8px; padding: 10px 12px; color: #fff; font-size: 14px; background: transparent; cursor: pointer; text-align: left; margin-bottom: 20px; transition: 0.2s; }
        .new-chat-btn:hover { background-color: #212121; }
        .credit-card { background-color: #2f2f2f; border-radius: 8px; padding: 12px; border: 1px solid #424242; }
        .credit-card-title { font-size: 11px; text-transform: uppercase; color: #b4b4b4; font-weight: 600; margin-bottom: 4px; }
        .credit-value { font-size: 18px; font-weight: bold; color: #10a37f; }

        #main-container { flex: 1; display: flex; flex-direction: column; position: relative; background-color: #212121; }
        #header { height: 52px; border-bottom: 1px solid #2f2f2f; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; font-weight: 600; font-size: 15px; color: #b4b4b4; }

        #chat-flow { flex: 1; overflow-y: auto; padding: 20px 0; display: flex; flex-direction: column; gap: 24px; }
        .chat-row { width: 100%; max-width: 760px; margin: 0 auto; padding: 0 20px; display: flex; gap: 16px; }
        .user-row { justify-content: flex-end; }

        .avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: bold; flex-shrink: 0; }
        .bot-avatar { background-color: #10a37f; color: white; }
        .user-avatar { background-color: #5436da; color: white; }

        .bubble-container { flex: 1; max-width: 85%; }
        .user-bubble { background-color: #2f2f2f; padding: 10px 16px; border-radius: 18px; color: #ececec; display: inline-block; float: right; font-size: 15px; line-height: 1.5; }
        .bot-bubble { color: #ececec; font-size: 15px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }

        .think-bar { background-color: #171717; border: 1px solid #2f2f2f; border-radius: 8px; margin-bottom: 12px; overflow: hidden; font-size: 12px; }
        .think-header { padding: 8px 12px; background-color: #2f2f2f; color: #abadba; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-weight: 600; }
        .think-content { padding: 10px 12px; color: #8e8ea0; font-style: italic; white-space: pre-wrap; word-break: break-word; }

        .meta-tag { font-size: 11px; color: #707070; margin-top: 6px; }

        #input-container { width: 100%; max-width: 760px; margin: 0 auto 24px auto; padding: 0 20px; }
        .input-box { background-color: #2f2f2f; border: 1px solid #424242; border-radius: 16px; padding: 10px 14px; display: flex; align-items: center; gap: 10px; }
        .input-box input { flex: 1; background: transparent; border: none; outline: none; color: white; font-size: 15px; }
        .input-box button { background-color: #676767; color: #212121; border: none; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: bold; transition: 0.2s; }
        .input-box button.active { background-color: #ffffff; color: #000000; }

        .side-bottom { margin-top: auto; display: flex; flex-direction: column; gap: 10px; }
        .toggle-card { background-color: #2f2f2f; border-radius: 8px; padding: 12px; border: 1px solid #424242; display: flex; align-items: center; justify-content: space-between; }
        .toggle-switch { position: relative; display: inline-block; width: 40px; height: 22px; flex-shrink: 0; }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .toggle-slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #424242; transition: 0.2s; border-radius: 22px; }
        .toggle-slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: white; transition: 0.2s; border-radius: 50%; }
        .toggle-switch input:checked + .toggle-slider { background-color: #10a37f; }
        .toggle-switch input:checked + .toggle-slider:before { transform: translateX(18px); }
    </style>
</head>
<body>

<div id="sidebar">
    <button id="newChatBtn" class="new-chat-btn">+ New chat</button>
    <div class="side-bottom">
        <div class="toggle-card">
            <div class="credit-card-title" style="margin-bottom:0;">Web Search</div>
            <label class="toggle-switch">
                <input type="checkbox" id="webSearchToggle" checked>
                <span class="toggle-slider"></span>
            </label>
        </div>
        <div class="credit-card">
            <div class="credit-card-title">System Credits</div>
            <div id="creditDisplay" class="credit-value">1000</div>
        </div>
    </div>
</div>

<div id="main-container">
    <div id="header">
        <span>JUSTTALK 1.1 ALPHA</span>
        <span style="font-size: 12px; color: #10a37f;">● Web Engine Active</span>
    </div>

    <div id="chat-flow"></div>

    <div id="input-container">
        <div class="input-box">
            <input type="text" id="userInput" placeholder="Message JUSTTALK 1.1 ALPHA...">
            <button id="sendBtn">↑</button>
        </div>
    </div>
</div>

<script src="main.js"></script>
</body>
</html>
